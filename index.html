<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3b3022">
<meta name="fireside-comments-api" content="">
<title>炉边书局</title>
  <script type="module" crossorigin src="./assets/index-Cm3ZYUfo.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-CBXHDJzm.css">
</head>
<body>
<header class="bar">
  <a class="brand" href="#1" aria-label="炉边书局，回到第一章"><span class="seal">炉</span>炉边书局</a>
  <span class="work">崇祯元年，我造了台会思考的炉子</span>
  <nav>
    <button id="catalog">目录</button>
    <button id="prefs">阅读设置</button>
  </nav>
</header>

<main class="scroll">
  <article class="paper">
    <header class="head">
      <div class="slip"><span id="vol">卷一</span><span id="chapter"></span><h1 id="title" tabindex="-1"></h1></div>
      <p class="date" id="date"></p>
    </header>
    <div id="prose"></div>
    <p class="end" aria-hidden="true">本章完</p>
    <footer class="after">
      <a id="next" class="next" hidden>
        <span class="next-copy"><span class="next-label">下一章</span><strong id="nextTitle"></strong></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
      </a>
      <button id="endCatalog" class="next" type="button" hidden>
        <span class="next-copy"><span class="next-label">已读至最新章</span><strong>回到目录</strong></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
      </button>
      <div class="acts">
        <button id="like" class="action" type="button" aria-pressed="false" aria-describedby="localHint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v10H3V10h4Zm0 0 4.5-7A2.5 2.5 0 0 1 14 5.5L13 9h5.6a2 2 0 0 1 2 2.4l-1.3 7A2 2 0 0 1 17.4 20H7"/></svg>
          点赞
        </button>
        <button id="support" class="action" type="button">支持作者</button>
      </div>
      <p id="likeStatus" class="reaction-status" role="status"></p>
      <section class="discussion" aria-labelledby="discussionTitle">
        <div class="discussion-heading">
          <h2 id="discussionTitle">本章评论</h2>
          <span id="noteCount" class="note-count">0 条</span>
        </div>
        <p id="localHint" class="hint">共享评论尚未开放。Cookie 用于记住游客编号和昵称。</p>
        <form id="noteForm" class="composer" method="post" aria-labelledby="discussionTitle">
          <span id="readerAvatar" class="comment-avatar" aria-hidden="true">客</span>
          <div class="composer-body">
            <div class="identity">
              <label for="nickname">昵称</label>
              <input id="nickname" name="nickname" maxlength="20" autocomplete="nickname" placeholder="填写昵称" aria-describedby="nicknameHint">
            </div>
            <p id="nicknameHint" class="field-hint">可直接修改，留空则使用游客昵称。</p>
            <label for="note">写下读后感</label>
            <textarea id="note" name="comment" maxlength="800" required aria-describedby="noteLimit" placeholder="聊聊这一章里让你印象最深的地方……"></textarea>
            <div class="composer-footer">
              <span id="noteLimit" class="note-limit">0 / 800</span>
              <button class="post-comment" type="submit" disabled>发表评论</button>
            </div>
          </div>
          <p id="noteStatus" class="comment-status" role="status"></p>
        </form>
        <p id="noteEmpty" class="comment-empty" role="status">正在加载评论……</p>
        <ul id="notes" class="comment-list" aria-label="本章评论，最新在前"></ul>
        <button id="refreshNotes" class="action" type="button" hidden>刷新评论</button>
      </section>
    </footer>
  </article>

  <div class="geshui" aria-hidden="true"></div>

  <aside class="silk" aria-label="本章图版">
    <div class="view" id="view" tabindex="0">
      <img id="poster" alt="">
      <div class="colophon" id="colophon">
        <span class="mark" aria-hidden="true">炉边<br>藏画</span>
        <p id="plateNote"></p>
        <h2 id="plateTitle"></h2>
      </div>
      <p class="tip" id="tip"></p>
    </div>
  </aside>
</main>

<dialog id="dialog"><div id="dialogBody"></div><button id="close">关闭</button></dialog>
</body>
</html>
